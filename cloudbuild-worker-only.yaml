substitutions:
  _REGION: us-central1
  _REPO: medibox-repo
  _WORKER_SERVICE: medibox-worker
  _VPC_CONNECTOR: medibox-connector
  _IMAGE_TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-worker
    args:
      - build
      - -f
      - services/worker/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:${_IMAGE_TAG}
      - .
    waitFor: ["-"]

  - name: gcr.io/cloud-builders/docker
    id: push-worker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:${_IMAGE_TAG}"]
    waitFor: [build-worker]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=medibox-runner@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:medibox-postgres
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --min-instances=1
      - --max-instances=5
      - --concurrency=1
      - --cpu=2
      - --memory=2Gi
      - --timeout=3600s
      - --no-allow-unauthenticated
      - --update-secrets=DATABASE_URL_SYNC=medibox-database-url-sync:latest,REDIS_AUTH_STRING=medibox-redis-auth:latest,PII_ENCRYPTION_KEY=medibox-pii-encryption-key:latest,CELERY_BROKER_URL=medibox-celery-broker-url:latest,CELERY_RESULT_BACKEND=medibox-celery-result-backend:latest
      - --update-env-vars=^;^ENVIRONMENT=production;GCP_PROJECT_ID=$PROJECT_ID;GCP_REGION=${_REGION};GCS_CROPS_BUCKET=$PROJECT_ID-crops;GCS_MODELS_BUCKET=$PROJECT_ID-models;KMS_KEY_NAME=projects/$PROJECT_ID/locations/${_REGION}/keyRings/medibox/cryptoKeys/pii-key;CELERY_QUEUES=inference,default;VERTEX_ENDPOINT_ID=1778860829916004352;VERTEX_ENDPOINT_REGION=us-central1
    waitFor: [push-worker]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:${_IMAGE_TAG}
