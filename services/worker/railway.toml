[build]
builder = "DOCKERFILE"
dockerfilePath = "services/worker/Dockerfile"
buildContext = "."

[deploy]
startCommand = "python -m services.worker.startup && celery -A services.worker.celery_app worker --loglevel=info --queues=inference,default --concurrency=1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
