substitutions:
  _REGION: us-central1
  _REPO: medibox-repo
  _API_SERVICE: medibox-api
  _VPC_CONNECTOR: medibox-connector
  _IMAGE_TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - services/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_IMAGE_TAG}
      - .
    waitFor: ["-"]

  - name: gcr.io/cloud-builders/docker
    id: push-api
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_IMAGE_TAG}"]
    waitFor: [build-api]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=medibox-runner@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:medibox-postgres
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --min-instances=0
      - --max-instances=5
      - --concurrency=80
      - --cpu=1
      - --memory=1Gi
      - --timeout=60s
      - --allow-unauthenticated
      - --update-secrets=DB_PASSWORD=medibox-db-password:latest,REDIS_AUTH_STRING=medibox-redis-auth:latest,FIREBASE_ADMIN_JSON=medibox-firebase-admin-json:latest,JWT_SIGNING_KEY=medibox-jwt-signing-key:latest,PII_ENCRYPTION_KEY=medibox-pii-encryption-key:latest,CELERY_BROKER_URL=medibox-celery-broker-url:latest
      - --update-env-vars=ENVIRONMENT=production,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},GCS_CROPS_BUCKET=$PROJECT_ID-crops,GCS_MODELS_BUCKET=$PROJECT_ID-models,KMS_KEY_NAME=projects/$PROJECT_ID/locations/${_REGION}/keyRings/medibox/cryptoKeys/pii-key,DB_HOST=/cloudsql/$PROJECT_ID:${_REGION}:medibox-postgres,CAMERA_SECRET=medibox-camera-prod-2026,FIREBASE_PROJECT_ID=$PROJECT_ID
    waitFor: [push-api]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_IMAGE_TAG}
