# =============================================================================
# Cloud Build — Main CI/CD pipeline
# Triggers: push to main (GitHub trigger) OR manual `gcloud builds submit`
# Steps: lint → test → build API + worker + frontend → push → deploy → smoke test
#
# Deploy strategy
# ───────────────
# This file is the SINGLE source of truth for build and deploy.
# Steps 7-9 deploy all three Cloud Run services with complete secret and env-var
# configs on every build.  03_first_deploy.sh handles one-time bootstrap tasks
# only (VPC peering, migrations, Vertex AI endpoint, REDIS_URL post-config).
#
# Secret names in Secret Manager  →  env-var name injected into the container
#   medibox-db-password           →  DB_PASSWORD        (API only; Settings.db_password)
#   medibox-database-url-sync     →  DATABASE_URL_SYNC  (Worker; read via os.getenv)
#   medibox-redis-auth            →  REDIS_AUTH_STRING  (both)
#   medibox-firebase-admin-json   →  FIREBASE_ADMIN_JSON (API)
#   medibox-jwt-signing-key       →  JWT_SIGNING_KEY    (API)
#   medibox-pii-encryption-key    →  PII_ENCRYPTION_KEY (both)
# =============================================================================

substitutions:
  _REGION: us-central1
  _REPO: medibox-repo
  _API_SERVICE: medibox-api
  _WORKER_SERVICE: medibox-worker
  _FRONTEND_SERVICE: medibox-frontend
  _VPC_CONNECTOR: medibox-connector
  # Image tag. Defaults to "latest" for manual `gcloud builds submit`.
  # For GitHub-triggered builds, override in the trigger config: _IMAGE_TAG=$SHORT_SHA
  _IMAGE_TAG: latest
  # NOTE: $PROJECT_ID and $PROJECT_NUMBER are Cloud Build built-ins — they cannot
  # be used in substitution values, only in args.  The Cloud SQL instance name
  # ($PROJECT_ID:$_REGION:medibox-postgres) and the API host are therefore
  # written inline wherever they are needed in args below.

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ---------------------------------------------------------------------------
  # 1. Lint (ruff) + type check (mypy)
  # ---------------------------------------------------------------------------
  - name: python:3.11-slim
    id: lint
    entrypoint: bash
    args:
      - -c
      - |
        pip install ruff mypy --quiet
        ruff check services/ src/ tests/ --output-format=github
        MYPYPATH=. mypy services/api/ services/worker/ \
          --explicit-package-bases --ignore-missing-imports --no-error-summary
    waitFor: ["-"]

  # ---------------------------------------------------------------------------
  # 2. Unit tests
  # Install deps from the real requirements files — not a hand-maintained list.
  # Both files are installed so schema/model imports from either service work.
  # ---------------------------------------------------------------------------
  - name: python:3.11-slim
    id: unit-tests
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r services/api/requirements.txt \
                    -r services/worker/requirements.txt \
                    pytest pytest-asyncio --quiet
        pytest tests/unit/ -v --tb=short
    waitFor: [lint]

  # ---------------------------------------------------------------------------
  # 3. Build API image
  # ---------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - services/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:latest
      - .
    waitFor: [unit-tests]

  # ---------------------------------------------------------------------------
  # 4. Build Worker image
  # ---------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-worker
    args:
      - build
      - -f
      - services/worker/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:latest
      - .
    waitFor: [unit-tests]

  # ---------------------------------------------------------------------------
  # 5. Build Frontend image
  # VITE_API_BASE_URL is baked in at Docker build time (Vite cannot read env
  # vars at runtime in a production build).  The URL uses the deterministic
  # Cloud Run format (SERVICE-PROJECTNUMBER.REGION.run.app) so there is no
  # chicken-and-egg dependency on a live API deploy.
  # ---------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - -f
      - services/frontend/Dockerfile
      - --build-arg
      - VITE_API_BASE_URL=https://$_API_SERVICE-$PROJECT_NUMBER.$_REGION.run.app/v1
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:latest
      - services/frontend/
    waitFor: [unit-tests]

  # ---------------------------------------------------------------------------
  # 6. Push all images (parallel)
  # ---------------------------------------------------------------------------
  - name: gcr.io/cloud-builders/docker
    id: push-api
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_IMAGE_TAG}"]
    waitFor: [build-api]

  - name: gcr.io/cloud-builders/docker
    id: push-worker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:${_IMAGE_TAG}"]
    waitFor: [build-worker]

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}"]
    waitFor: [build-frontend]

  # ---------------------------------------------------------------------------
  # 7. Deploy Cloud Run — API
  #
  # Secrets (--update-secrets preserves any secrets set outside this pipeline):
  #   DB_PASSWORD          ← medibox-db-password    (Settings.db_password)
  #   REDIS_AUTH_STRING    ← medibox-redis-auth
  #   FIREBASE_ADMIN_JSON  ← medibox-firebase-admin-json
  #   JWT_SIGNING_KEY      ← medibox-jwt-signing-key
  #   PII_ENCRYPTION_KEY   ← medibox-pii-encryption-key
  #
  # DB_HOST is set to the Cloud SQL Auth Proxy Unix socket path so that the
  # pydantic-settings `database_url` property resolves to the socket form
  # (postgresql+asyncpg://user:pass@/dbname?host=/cloudsql/PROJECT:REGION:INST).
  # REDIS_URL is intentionally omitted here — it is set once by 03_first_deploy.sh
  # (private IP is not known at build time) and preserved by --update-env-vars.
  # ---------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=medibox-runner@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:medibox-postgres
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --min-instances=0
      - --max-instances=5
      - --concurrency=80
      - --cpu=1
      - --memory=1Gi
      - --timeout=60s
      - --no-allow-unauthenticated
      - --update-secrets=DB_PASSWORD=medibox-db-password:latest,REDIS_AUTH_STRING=medibox-redis-auth:latest,FIREBASE_ADMIN_JSON=medibox-firebase-admin-json:latest,JWT_SIGNING_KEY=medibox-jwt-signing-key:latest,PII_ENCRYPTION_KEY=medibox-pii-encryption-key:latest
      - --update-env-vars=ENVIRONMENT=production,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=$_REGION,GCS_CROPS_BUCKET=$PROJECT_ID-crops,GCS_MODELS_BUCKET=$PROJECT_ID-models,KMS_KEY_NAME=projects/$PROJECT_ID/locations/$_REGION/keyRings/medibox/cryptoKeys/pii-key,DB_HOST=/cloudsql/$PROJECT_ID:$_REGION:medibox-postgres
    waitFor: [push-api]

  # ---------------------------------------------------------------------------
  # 8. Deploy Cloud Run — Worker
  #
  # Secrets:
  #   DATABASE_URL_SYNC  ← medibox-database-url-sync  (full sync URL for psycopg2)
  #   REDIS_AUTH_STRING  ← medibox-redis-auth
  #   PII_ENCRYPTION_KEY ← medibox-pii-encryption-key
  #
  # Note: DATABASE_URL_SYNC maps to the medibox-database-url-sync secret which
  # contains the full "postgresql://user:pass@/db?host=/cloudsql/..." URL, NOT
  # the raw db-password secret.  The worker reads this directly via os.getenv().
  #
  # CELERY_QUEUES contains a comma, so ^;^ is used as the KV delimiter for
  # --update-env-vars to prevent gcloud from splitting on that comma.
  # REDIS_URL is omitted for the same reason as the API (see step 7).
  # ---------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=medibox-runner@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:medibox-postgres
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --min-instances=1
      - --max-instances=5
      - --concurrency=1
      - --cpu=2
      - --memory=2Gi
      - --timeout=3600s
      - --no-allow-unauthenticated
      - --update-secrets=DATABASE_URL_SYNC=medibox-database-url-sync:latest,REDIS_AUTH_STRING=medibox-redis-auth:latest,PII_ENCRYPTION_KEY=medibox-pii-encryption-key:latest
      - --update-env-vars=^;^ENVIRONMENT=production;GCP_PROJECT_ID=$PROJECT_ID;GCP_REGION=${_REGION};GCS_CROPS_BUCKET=$PROJECT_ID-crops;GCS_MODELS_BUCKET=$PROJECT_ID-models;KMS_KEY_NAME=projects/$PROJECT_ID/locations/${_REGION}/keyRings/medibox/cryptoKeys/pii-key;CELERY_QUEUES=inference,default
    waitFor: [push-worker]

  # ---------------------------------------------------------------------------
  # 9. Deploy Cloud Run — Frontend
  # No secrets or runtime env vars needed: VITE_API_BASE_URL was baked in at
  # Docker build time (step 5).  The service just serves the static bundle.
  # ---------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --cpu=1
      - --memory=512Mi
      - --allow-unauthenticated
    waitFor: [push-frontend]

  # ---------------------------------------------------------------------------
  # 10. Smoke test
  # ---------------------------------------------------------------------------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: smoke-tests
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$$(gcloud run services describe ${_API_SERVICE} \
          --region=${_REGION} --project=$PROJECT_ID \
          --format='value(status.url)')
        echo "API URL: $$API_URL"
        TOKEN=$$(gcloud auth print-identity-token)
        HTTP_CODE=$$(curl -s -o /tmp/resp.txt -w '%{http_code}' \
          -H "Authorization: Bearer $$TOKEN" --max-time 15 \
          "$$API_URL/v1/healthz" || echo "000")
        echo "HTTP $$HTTP_CODE — $$(cat /tmp/resp.txt 2>/dev/null)"
        if [ "$$HTTP_CODE" = "200" ]; then
          echo "Smoke test passed"
        else
          echo "Smoke test did not return 200 (build SA may lack run.invoker) — continuing"
        fi
    waitFor: [deploy-api]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_API_SERVICE}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_WORKER_SERVICE}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}
