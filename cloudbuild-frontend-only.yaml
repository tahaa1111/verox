# Fast build: frontend only — skips API/worker rebuild
# Usage: gcloud builds submit --config cloudbuild-frontend-only.yaml .

substitutions:
  _REGION: us-central1
  _REPO: medibox-repo
  _FRONTEND_SERVICE: medibox-frontend
  _API_SERVICE: medibox-api
  _IMAGE_TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    secretEnv: ["VITE_FIREBASE_API_KEY"]
    entrypoint: bash
    args:
      - -c
      - |
        # Strip BOM (\xEF\xBB\xBF) and any carriage-return/newline that Secret Manager
        # may inject when the secret was saved from a Windows editor or via the console.
        CLEAN_KEY=$(printf '%s' "$$VITE_FIREBASE_API_KEY" | tr -d '\r\n' | sed 's/^\xEF\xBB\xBF//')
        echo "Firebase key length after clean: ${#CLEAN_KEY}"
        docker build \
          -f services/frontend/Dockerfile \
          --build-arg VITE_API_BASE_URL=https://$_API_SERVICE-$PROJECT_NUMBER.$_REGION.run.app/v1 \
          --build-arg VITE_FIREBASE_API_KEY=$$CLEAN_KEY \
          --build-arg VITE_FIREBASE_AUTH_DOMAIN=verox-4dc3f.firebaseapp.com \
          --build-arg VITE_FIREBASE_PROJECT_ID=verox-4dc3f \
          --build-arg VITE_FIREBASE_STORAGE_BUCKET=verox-4dc3f.firebasestorage.app \
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=272258744118 \
          --build-arg VITE_FIREBASE_APP_ID=1:272258744118:web:af92c89718758d3531bd97 \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_IMAGE_TAG} \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:latest \
          services/frontend/
    waitFor: ["-"]

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}"]
    waitFor: [build-frontend]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --cpu=1
      - --memory=512Mi
      - --allow-unauthenticated
    waitFor: [push-frontend]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/medibox-firebase-web-api-key/versions/latest
      env: VITE_FIREBASE_API_KEY
