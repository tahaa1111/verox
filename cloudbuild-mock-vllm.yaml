options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -f
      - services/mock_vllm/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/medibox-repo/medibox-mock-vllm:latest
      - .
    waitFor: ["-"]

  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, "us-central1-docker.pkg.dev/$PROJECT_ID/medibox-repo/medibox-mock-vllm:latest"]
    waitFor: [build]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - medibox-mock-vllm
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/medibox-repo/medibox-mock-vllm:latest
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=1
      - --memory=256Mi
      - --cpu=1
      - --timeout=60s
    waitFor: [push]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/medibox-repo/medibox-mock-vllm:latest
