name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Dependency vulnerability scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Scan API dependencies
        run: |
          pip-audit -r services/api/requirements.txt --format=json \
            --output=api-audit.json || true

      - name: Report vulnerabilities (fail on HIGH with available fix)
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open("api-audit.json"))
          except Exception:
              print("No audit data — skipping")
              sys.exit(0)
          vulns = [v for p in data.get("dependencies", []) for v in p.get("vulns", [])]
          if not vulns:
              print("No vulnerabilities found.")
              sys.exit(0)
          high = [v for v in vulns if v.get("fix_versions")]
          for v in vulns:
              severity = "HIGH" if v in high else "INFO"
              print(f"[{severity}] {v['id']}: {v['description'][:100]}")
          if high:
              print(f"\nFAIL: {len(high)} high-severity vulnerabilities with available fixes.")
              sys.exit(1)
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit
          path: api-audit.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. Container image scan (Trivy)
  # ---------------------------------------------------------------------------
  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image for scanning
        run: docker build -f services/api/Dockerfile -t medibox-api:scan . 2>&1 | tail -5

      - name: Scan with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: medibox-api:scan
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan with Trivy (warn on HIGH)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: medibox-api:scan
          format: table
          exit-code: "0"
          severity: HIGH
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 3. Lint + type check + tests
  # ---------------------------------------------------------------------------
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r services/api/requirements.txt \
                      ruff mypy pytest pytest-asyncio --quiet

      - name: Lint (ruff)
        run: ruff check services/ tests/ --output-format=github

      - name: Type check (mypy)
        run: |
          MYPYPATH=. mypy services/api/ \
            --explicit-package-bases --ignore-missing-imports \
            --disable-error-code=import-untyped --no-error-summary

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 4. Deploy — only runs after security scan + tests pass
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API → Railway
    needs: [security-scan, image-scan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service medibox-api --environment production --detach
