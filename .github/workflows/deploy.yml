name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Security — dependency vulnerability scanning
  # ---------------------------------------------------------------------------
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit --quiet

      - name: Scan API dependencies
        run: pip-audit -r services/api/requirements.txt --format=json --output=api-audit.json || true

      - name: Scan Worker dependencies
        run: pip-audit -r services/worker/requirements.txt --format=json --output=worker-audit.json || true

      - name: Report vulnerabilities
        run: |
          echo "=== API Vulnerabilities ===" && cat api-audit.json | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          vulns=[v for p in data.get('dependencies',[]) for v in p.get('vulns',[])]
          if vulns:
              print(f'FOUND {len(vulns)} vulnerabilities:')
              for v in vulns: print(f'  {v[\"id\"]}: {v[\"description\"][:80]}')
              # Fail on CRITICAL/HIGH severity only
              high=[v for v in vulns if v.get('fix_versions')]
              if len(high)>0: sys.exit(1)
          else: print('No vulnerabilities found.')
          " || echo "Scan completed with warnings"
          echo "=== Worker Vulnerabilities ===" && cat worker-audit.json | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          vulns=[v for p in data.get('dependencies',[]) for v in p.get('vulns',[])]
          if vulns:
              print(f'FOUND {len(vulns)} vulnerabilities:')
              for v in vulns: print(f'  {v[\"id\"]}: {v[\"description\"][:80]}')
          else: print('No vulnerabilities found.')
          " || echo "Scan completed with warnings"

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: "*-audit.json"
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. Container image scanning (Trivy)
  # ---------------------------------------------------------------------------
  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image for scanning
        run: docker build -f services/api/Dockerfile -t medibox-api:scan . 2>&1 | tail -5

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medibox-api:scan
          format: table
          exit-code: "0"          # warn only — don't block deploy on OS CVEs
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build Worker image for scanning
        run: docker build -f services/worker/Dockerfile -t medibox-worker:scan . 2>&1 | tail -5

      - name: Scan Worker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medibox-worker:scan
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # 3. Lint + type check + tests
  # ---------------------------------------------------------------------------
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r services/api/requirements.txt \
                      -r services/worker/requirements.txt \
                      ruff mypy pytest pytest-asyncio --quiet

      - name: Lint
        run: ruff check services/ tests/ --output-format=github

      - name: Type check
        run: |
          MYPYPATH=. mypy services/api/ services/worker/ \
            --explicit-package-bases --ignore-missing-imports \
            --disable-error-code=import-untyped --no-error-summary

      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 4. Deploy (only after all checks pass)
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API → Railway
    needs: [security-scan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service medibox-api --detach

  deploy-worker:
    name: Deploy Worker → Railway
    needs: [security-scan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service medibox-worker --detach
